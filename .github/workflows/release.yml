name: Release

# Publishes a GitHub release (what HACS uses to offer updates) on:
#  - every push to main: releases manifest.json's version; if that tag already
#    exists, bumps the patch version first and commits it back to main.
#  - a pushed v* tag (manual releases).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-and-release:
    # Skip the bot's own version-bump commits (GITHUB_TOKEN pushes don't retrigger anyway).
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Lint and tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          ruff check .
          ruff format --check .
          pytest -v tests/test_engine.py tests/test_integration_structure.py

      - name: Resolve release version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VER=$(python3 -c "import json; print(json.load(open('custom_components/hass_solar_orchestrator/manifest.json'))['version'])")
          if git rev-parse -q --verify "refs/tags/v${VER}" >/dev/null; then
            VER=$(python3 - <<'PY'
          import json, re, pathlib
          mp = pathlib.Path("custom_components/hass_solar_orchestrator/manifest.json")
          manifest = json.loads(mp.read_text())
          maj, min_, pat = map(int, manifest["version"].split("."))
          new_ver = f"{maj}.{min_}.{pat + 1}"
          manifest["version"] = new_ver
          mp.write_text(json.dumps(manifest, indent=2) + "\n")
          pp = pathlib.Path("pyproject.toml")
          pp.write_text(re.sub(r'^version\s*=\s*"[^"]+"', f'version = "{new_ver}"', pp.read_text(), count=1, flags=re.M))
          print(new_ver)
          PY
            )
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml custom_components/hass_solar_orchestrator/manifest.json
            git commit -m "chore(release): v${VER}"
            git push origin HEAD:main
          fi
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"

      - name: Package HACS zip
        run: |
          cd custom_components/hass_solar_orchestrator
          zip -r ../../hass_solar_orchestrator.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.ref_type == 'tag' && github.sha || 'main' }}
          generate_release_notes: true
          files: hass_solar_orchestrator.zip
