name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Lint and tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          ruff check .
          ruff format --check .
          pytest -v tests/test_engine.py tests/test_integration_structure.py
      - name: Package HACS zip
        run: |
          cd custom_components/hass_solar_orchestrator
          zip -r ../../hass_solar_orchestrator.zip .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: hass_solar_orchestrator.zip
